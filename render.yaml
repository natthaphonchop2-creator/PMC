services:
  - type: web
    runtime: node
    name: pmc-ads-agent
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASIC_AUTH_USER
        value: pmc
      - key: APP_BASIC_AUTH_PASSWORD
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_GRAPH_VERSION
        value: v21.0
      - key: META_DATE_PRESET
        value: last_30d
      - key: META_MAX_PAGES
        value: "6"
