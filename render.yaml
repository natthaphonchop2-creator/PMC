services:
  - type: web
    runtime: node
    name: pmc-ads-agent
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASIC_AUTH_USER
        value: pmc
      - key: APP_BASIC_AUTH_PASSWORD
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: META_WORKSPACES_JSON
        sync: false
      - key: META_ACTIVE_WORKSPACE_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      - key: META_GRAPH_VERSION
        value: v21.0
      - key: META_DATE_PRESET
        value: last_30d
      - key: META_MAX_PAGES
        value: "6"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "2800"
      - key: BOOKING_LINE_CHANNEL_SECRET
        sync: false
      - key: BOOKING_APPS_SCRIPT_INGRESS_URL
        sync: false
      - key: BOOKING_INGRESS_SECRET
        sync: false
      - key: BOOKING_GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BOOKING_MEDIA_SIGNING_SECRET
        sync: false
